<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remote Screen</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:94%;
  max-width:430px;
  background:#111d31;
  padding:25px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 15px 45px #0008;
}

h1{
  margin:0 0 8px;
}

.sub{
  color:#aebbd0;
  margin-bottom:25px;
}

button{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:0;
  border-radius:13px;
  background:#1976ff;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

.status{
  background:#202f48;
  padding:13px;
  border-radius:12px;
  margin:12px 0;
}

.qr{
  width:230px;
  height:230px;
  background:white;
  margin:20px auto;
  padding:10px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

input{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:16px;
  margin:8px 0;
}

.hidden{
  display:none;
}

.green{
  color:#42e878;
}

.yellow{
  color:#ffd43b;
}

.red{
  color:#ff6464;
}

.code{
  font-size:27px;
  font-weight:bold;
  letter-spacing:5px;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="app">

<h1>📱 Remote Screen</h1>

<div class="sub">
2 Phone Connection
</div>


<!-- HOME -->

<div id="home">

<button onclick="startA()">
📱 Phone A — Controller
</button>

<button onclick="startB()">
📲 Phone B — Screen
</button>

</div>


<!-- PHONE A -->

<div id="phoneA" class="hidden">

<h2>📱 Phone A</h2>

<div class="status yellow" id="statusA">
🟡 Room बनाया जा रहा है...
</div>

<div class="code" id="roomCode">
------
</div>

<div class="qr" id="qrcode"></div>

<p>
Phone B से QR स्कैन करें
</p>

<div class="status" id="connectionA">
🔴 Phone B का इंतजार...
</div>

<button onclick="location.reload()">
❌ बंद करें
</button>

</div>


<!-- PHONE B -->

<div id="phoneB" class="hidden">

<h2>📲 Phone B</h2>

<div class="status">
Phone A का QR खोलें या Code डालें
</div>

<input
id="pairCode"
placeholder="6 Digit Pair Code"
maxlength="6"
inputmode="numeric"
>

<button onclick="joinRoom()">
🔗 Connect
</button>

<div class="status" id="connectionB">
🔴 Connected नहीं है
</div>

<button onclick="location.reload()">
❌ बंद करें
</button>

</div>

</div>


<script>

let socket = null;
let currentRoom = null;


// PHONE A

function startA(){

  document.getElementById("home")
  .classList.add("hidden");

  document.getElementById("phoneA")
  .classList.remove("hidden");

  connectSocket();

  socket.emit("create-room");
}


// PHONE B

function startB(){

  document.getElementById("home")
  .classList.add("hidden");

  document.getElementById("phoneB")
  .classList.remove("hidden");

  connectSocket();

  checkRoomFromURL();
}


// SOCKET

function connectSocket(){

  socket = io();

  socket.on("connect",()=>{

    console.log(
      "Connected:",
      socket.id
    );

  });


  socket.on("connect_error",()=>{

    alert(
      "Server से connection नहीं हुआ।"
    );

  });


  // Room created

  socket.on(
    "room-created",
    (code)=>{

      currentRoom = code;

      document.getElementById(
        "roomCode"
      ).innerText = code;

      document.getElementById(
        "statusA"
      ).innerHTML =
        "🟢 Room तैयार है";

      createQR(code);

    }
  );


  // Phone B connected

  socket.on(
    "peer-connected",
    ()=>{

      document.getElementById(
        "connectionA"
      ).innerHTML =
        "🟢 Phone B Connected";

      document.getElementById(
        "connectionA"
      ).className =
        "status green";

    }
  );


  // Phone B joined

  socket.on(
    "joined-room",
    (code)=>{

      currentRoom = code;

      document.getElementById(
        "connectionB"
      ).innerHTML =
        "🟢 Phone A से Connected";

      document.getElementById(
        "connectionB"
      ).className =
        "status green";

    }
  );


  // Error

  socket.on(
    "room-error",
    (message)=>{

      alert(message);

    }
  );

}


// QR CODE

function createQR(code){

  const box =
    document.getElementById(
      "qrcode"
    );

  box.innerHTML = "";

  const joinURL =
    location.origin +
    "/?room=" +
    code;

  new QRCode(
    box,
    {
      text:joinURL,
      width:210,
      height:210
    }
  );

}


// JOIN ROOM

function joinRoom(){

  const code =
    document.getElementById(
      "pairCode"
    ).value.trim();

  if(!code){

    alert(
      "Pair Code डालें"
    );

    return;
  }

  if(code.length !== 6){

    alert(
      "6 अंकों का Code डालें"
    );

    return;
  }

  socket.emit(
    "join-room",
    code
  );

}


// QR से automatic join

function checkRoomFromURL(){

  const params =
    new URLSearchParams(
      location.search
    );

  const room =
    params.get("room");

  if(room){

    document.getElementById(
      "pairCode"
    ).value = room;

    setTimeout(
      ()=>{
        joinRoom();
      },
      700
    );

  }

}

</script>

</body>
  </html>
