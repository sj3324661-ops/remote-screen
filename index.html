<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Remote Screen</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101114;
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 25px 18px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

.card {
    background: #1b1d22;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: 0;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #30333a;
    color: white;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #444;
    background: #111318;
    color: white;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    margin-top: 10px;
}

.hidden {
    display: none;
}

.code {
    font-size: 38px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 8px;
    margin: 20px 0;
}

#qrcode {
    background: white;
    padding: 12px;
    width: fit-content;
    margin: 20px auto;
}

.status {
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    background: #252830;
    color: #ddd;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <h1>📱 Remote Screen</h1>
    <div class="subtitle">
        Connect two phones securely
    </div>

    <!-- HOME -->
    <div id="home" class="card">
        <button class="primary" onclick="showController()">
            PHONE A — CONTROLLER
        </button>

        <button class="secondary" onclick="showScreen()">
            PHONE B — SCREEN
        </button>
    </div>

    <!-- PHONE A -->
    <div id="controller" class="card hidden">

        <h2>📱 Phone A</h2>

        <p>इस code को Phone B में डालें:</p>

        <div id="roomCode" class="code">------</div>

        <div id="qrcode"></div>

        <div id="aStatus" class="status">
            Code बनाया जा रहा है...
        </div>

        <button class="secondary" onclick="location.reload()">
            वापस जाएँ
        </button>

    </div>

    <!-- PHONE B -->
    <div id="screen" class="card hidden">

        <h2>📺 Phone B</h2>

        <p>Phone A का 6-digit code डालें:</p>

        <input
            id="codeInput"
            type="tel"
            maxlength="6"
            placeholder="123456"
        >

        <button class="primary" onclick="joinRoom()">
            CONNECT
        </button>

        <div id="bStatus" class="status">
            अभी connect नहीं है
        </div>

        <button class="secondary" onclick="location.reload()">
            वापस जाएँ
        </button>

    </div>

</div>

<script>

const socket = io();

function showController() {

    document.getElementById("home").classList.add("hidden");
    document.getElementById("controller").classList.remove("hidden");

    document.getElementById("aStatus").innerText =
        "Code बनाया जा रहा है...";

    socket.emit("create-room");
}

function showScreen() {

    document.getElementById("home").classList.add("hidden");
    document.getElementById("screen").classList.remove("hidden");

    const params = new URLSearchParams(location.search);
    const room = params.get("room");

    if (room) {
        document.getElementById("codeInput").value = room;
    }
}

function joinRoom() {

    const code =
        document.getElementById("codeInput").value.trim();

    if (code.length !== 6) {

        document.getElementById("bStatus").innerText =
            "कृपया 6-digit code डालें।";

        return;
    }

    document.getElementById("bStatus").innerText =
        "Connecting...";

    socket.emit("join-room", code);
}

socket.on("room-created", code => {

    document.getElementById("roomCode").innerText = code;

    document.getElementById("aStatus").innerText =
        "Phone B के connect होने का इंतज़ार है...";

    const qrURL =
        location.origin + "/?room=" + code;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text: qrURL,
            width: 180,
            height: 180
        }
    );
});

socket.on("peer-connected", () => {

    document.getElementById("aStatus").innerText =
        "✅ Phone B connected!";
});

socket.on("joined-room", code => {

    document.getElementById("bStatus").innerText =
        "✅ Phone A से connected!";
});

socket.on("room-error", message => {

    document.getElementById("bStatus").innerText =
        "❌ " + message;
});

</script>

</body>
  </html>
