plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remotescreen.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.remotescreen.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'io.socket:socket.io-client:2.1.0'
    implementation 'org.webrtc:google-webrtc:1.0.32006'
}
